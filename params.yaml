preprocess:
  input: "data/raw"
  output: "data/processed"

train:
  train_images: "data/yolo/images/train"
  val_images: "data/yolo/images/val"
  test_images: "data/yolo/images/test"
  train_labels: "data/raw/labels/train"
  val_labels: "data/raw/labels/val"
  yolo_train_labels: "data/yolo/labels/train"
  yolo_val_labels: "data/yolo/labels/val"

train_custom:
  imgsz: 640
  data_root: data/yolo
  num_classes: 7
  output_dir: models/custom

  backbone: efficientnet_b0
  pretrained_backbone: true

  train_split: train
  val_split: val

  batch_size: 4
  num_workers: 4
  epochs: 10

  lr: 0.0001
  weight_decay: 0.0001
  grad_clip: 5.0

  device: cuda
  seed: 42

  strides: [8, 16, 32]
  center_sampling_radius: 1.5
  object_sizes_of_interest:
    - [0.0, 64.0]
    - [64.0, 128.0]
    - [128.0, 100000000.0]

  amp: true
  experiment_name: custom_effnet_pan_af
  run_name: effnet_b1_pan_af_v2

demo:
    custom:
      weights: models/custom/best.pt
      num_classes: 7
      backbone: efficientnet_b0
      pretrained_backbone: false
      strides: [8, 16, 32]
      score_thresh: 0.25
      nms_iou: 0.5
      device: cuda

    yolo_fast:
      weights: yolov8n.pt
      conf: 0.25
      iou: 0.5
      device: cpu

    yolo_new:
      weights: runs/detect/runs_yolo/accurate/weights/best.pt
      conf: 0.25
      iou: 0.5
      device: cpu

yolo_fast:
  data_root: data.yaml
  nc: 7

  model: yolo11n.pt
  imgsz: 640
  epochs: 25
  batch: 16
  device: cuda
  workers: 4
  project: runs_yolo
  name: fast

yolo_new:
  data_root: data.yaml
  nc: 7

  model: yolo26s.pt
  imgsz: 640
  epochs: 25
  batch: 16
  device: cuda
  workers: 4
  project: runs_yolo
  name: accurate

yolo_train:
    data_root: data.yaml
    nc: 7

    imgsz: 640
    epochs: 50
    batch: 16
    device: cuda
    workers: 0

